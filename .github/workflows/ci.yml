name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  type-check:
    name: TypeScript Type Check (NestJS ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nestjs: ['11', '12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NestJS 12 comes from package-lock.json
      - name: Install NestJS ${{ matrix.nestjs }}
        if: matrix.nestjs != '12'
        run: npm install --no-save @nestjs/common@${{ matrix.nestjs }} @nestjs/core@${{ matrix.nestjs }} @nestjs/testing@${{ matrix.nestjs }}

      - name: Run type check
        run: npm run type-check

  test:
    name: Unit Tests (NestJS ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nestjs: ['11', '12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NestJS 12 comes from package-lock.json
      - name: Install NestJS ${{ matrix.nestjs }}
        if: matrix.nestjs != '12'
        run: npm install --no-save @nestjs/common@${{ matrix.nestjs }} @nestjs/core@${{ matrix.nestjs }} @nestjs/testing@${{ matrix.nestjs }}

      - name: Run unit tests
        run: npm test

  integration-test:
    name: Integration Tests (NestJS ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nestjs: ['11', '12']

    services:
      redis1:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      redis2:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

      redis3:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6381:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NestJS 12 comes from package-lock.json
      - name: Install NestJS ${{ matrix.nestjs }}
        if: matrix.nestjs != '12'
        run: npm install --no-save @nestjs/common@${{ matrix.nestjs }} @nestjs/core@${{ matrix.nestjs }} @nestjs/testing@${{ matrix.nestjs }}

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check build artifacts
        run: |
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/index.cjs || (echo "dist/index.cjs not found" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts not found" && exit 1)

      # NestJS 12 is ESM-only; the CommonJS build loads it through require(esm)
      - name: Load ESM and CommonJS entry points
        run: |
          node --input-type=module -e "await import('./dist/index.js')"
          node -e "require('./dist/index.cjs')"

  # Summary job - requires all other jobs to pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, test, integration-test, build]

    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
